[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-trading-v2"
version = "0.1.0"
description = "Independent domain foundation for auto_trading_v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "pyodbc==5.3.0",
    "python-dotenv==1.2.2",
    "pythonnet==3.1.0",
    "SQLAlchemy==2.0.51",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "ruff==0.15.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured temporary Microsoft SQL Server database",
    "external_integration: requires explicitly configured external provider credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
